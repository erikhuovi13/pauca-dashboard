<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ceo dashboard</title><style>
:root{--fg:#111;--mut:#555;--bg:#fbfaf7;--ln:#ddd;--red:#b00020}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}h2{font-size:13px;font-weight:600;letter-spacing:.08em;color:var(--mut);margin:28px 0 8px;border-bottom:1px solid var(--ln);padding-bottom:4px}
#banner{font-size:12px;padding:8px 16px;border-bottom:1px solid var(--ln);background:#fff}#banner.ex{background:#fff4d6}
.big{font-size:44px;font-weight:300}.card{border:1px solid var(--ln);background:#fff;padding:12px;margin:8px 0}
table{width:100%;border-collapse:collapse}td,th{text-align:right;padding:6px 4px;border-bottom:1px solid var(--ln)}td:first-child,th:first-child{text-align:left}th{font-weight:500;color:var(--mut);font-size:12px}
.meta{font-size:11px;color:var(--mut)}.meta a{color:var(--mut)}.uns{color:var(--red);font-weight:600}.stale{opacity:.55}.stale .meta::after{content:" · stale >24h";color:var(--red)}
.tag{font-size:11px;border:1px solid currentColor;padding:0 4px;margin-left:4px}.err{color:var(--red)}
</style></head><body><div id="banner">loading…</div><main id="app"></main>
<script>
const $=s=>document.querySelector(s),esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const now=Date.now(),DAY=864e5;
const fmtT=t=>{if(!t)return"no time";const d=new Date(t);return isNaN(d)?"bad time":d.toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})};
const isStale=t=>!t||isNaN(new Date(t))||now-new Date(t)>DAY;
const src=o=>o&&o.source&&o.source!=="EXAMPLE"?`<a href="${esc(o.source)}">source</a>`:`<span class="uns">no source</span>`;
const meta=o=>`<div class="meta">${src(o)} · as of ${esc(fmtT(o&&o.as_of))}</div>`;
const num=(v,o)=>{const ok=o&&o.source&&o.source!=="EXAMPLE";const s=(v===undefined||v===null||v==="")?"–":esc(v);return ok?s:`<span class="uns">${s}</span>`};
const cls=o=>isStale(o&&o.as_of)?"stale":"";
const A=x=>Array.isArray(x)?x:[];
function render(d){
  const b=$("#banner");b.className=d.example?"ex":"";
  b.innerHTML=`${d.example?"<b>example data</b> · ":""}generated ${esc(fmtT(d.generated_at))}${isStale(d.generated_at)?' <span class="uns">stale</span>':""}`;
  let h="";const fs=d.first_sale||{};
  const days=fs.target_date?Math.ceil((new Date(fs.target_date)-now)/DAY):null;
  const g=A(fs.gates).find(x=>x.id===fs.next_gate)||A(fs.gates).find(x=>x.status!=="done")||{};
  h+=`<h2>days to first sale</h2><div class="${cls(fs)}"><div class="big">${num(days===null||isNaN(days)?null:days,fs)}</div>
  <div>next gate: <b>${esc(g.label||fs.next_gate||"unknown")}</b></div>
  <div class="meta">${A(fs.gates).map(x=>`${esc(x.label)}: ${esc(x.status||"?")}`).join(" → ")}</div>${meta(fs)}</div>`;
  h+=`<h2>revenue scoreboard</h2><table><tr><th>venture</th><th>sent</th><th>replies</th><th>yes</th><th>paid</th></tr>`+
   A(d.scoreboard).map(r=>`<tr class="${cls(r)}"><td>${esc(r.venture)}${meta(r)}</td>${["sent","replies","yes","paid"].map(k=>`<td>${num(r[k],r)}</td>`).join("")}</tr>`).join("")+`</table>`;
  const dec=A(d.decisions).filter(x=>x.status!=="resolved").slice(0,3);
  h+=`<h2>decisions (${dec.length})</h2>`+(dec.length?dec.map(c=>`<div class="card ${cls(c)}"><b>${esc(c.question)}</b> <span class="tag">yes / no</span>
   <div>if you wait: ${esc(c.slips_if_waiting||"–")}</div><div>deadline: ${esc(fmtT(c.deadline))}</div>
   <div>default at deadline: ${esc(c.default_at_deadline||"–")}</div>${meta(c)}</div>`).join(""):`<div class="meta">nothing to decide</div>`);
  h+=`<h2>cash</h2><table><tr><th>cap</th><th>spent</th><th>committed</th><th>left</th></tr>`+A(d.cash).map(c=>{
   const cap=+c.cap_amount,left=isNaN(cap)?null:cap-(+c.spent||0)-(+c.committed||0);
   return `<tr class="${cls(c)}"><td>${esc(c.cap)} ($${esc(c.cap_amount??"?")})<span class="tag">${c.verified?"verified":"estimated"}</span>${meta(c)}</td><td>${num(c.spent,c)}</td><td>${num(c.committed,c)}</td><td>${num(left,c)}</td></tr>`}).join("")+`</table>`;
  h+=`<h2>blockers</h2>`+(A(d.blockers).map(x=>`<div class="card ${cls(x)}">${esc(x.text)} <span class="meta">· ${esc(x.owner||"no owner")} · since ${esc(fmtT(x.since))}</span>${meta(x)}</div>`).join("")||`<div class="meta">none</div>`);
  $("#app").innerHTML=h;
}
fetch("./data.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(render)
 .catch(e=>{$("#banner").innerHTML=`<span class="err">could not load data.json (${esc(e.message)})</span>`});
</script></body></html>
